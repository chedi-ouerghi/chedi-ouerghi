name: Generate profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-metrics-card

    steps:
      - name: Generate GitHub metrics card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, repositories
          config_timezone: Africa/Tunis
          config_output: svg
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size,percentage

      - name: Prepare metrics artifact
        run: |
          mkdir metrics-dist
          mv metrics.svg metrics-dist/metrics.svg

      - name: Publish metrics card
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: metrics-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
