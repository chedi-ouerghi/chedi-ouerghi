name: Generate profile cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: generate-github-metrics-card

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub metrics card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          output_action: none
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: chedi-ouerghi
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Tunis
          config_output: svg
          config_display: large
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size,percentage
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Prepare metrics artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p metrics-dist
          if [ ! -f /metrics_renders/metrics.svg ]; then
            echo "::error::/metrics_renders/metrics.svg was not generated by the metrics action"
            find /metrics_renders -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi
          grep -q '<svg' /metrics_renders/metrics.svg
          cp /metrics_renders/metrics.svg metrics-dist/metrics.svg

      - name: Publish metrics card
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: metrics-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
